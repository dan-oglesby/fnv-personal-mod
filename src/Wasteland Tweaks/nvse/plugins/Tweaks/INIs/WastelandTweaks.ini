; Wasteland Tweaks: overrides for Stewie Tweaks (read because bMultiINISupport = 1 in its main INI).
;
; bWeaponDamageStagesFix off (2026-11-16). On load, every dropped weapon runs that fix, which asks
; the game whether the weapon has mods. JIP LN 57.30 answers by following the weapon's
; ExtraItemDropper back to whoever dropped it, and if that actor has since been deleted (a cleaned-up
; temporary spawn) the pointer is freed memory and the game crashes (a Pool Cue in the Mojave,
; crash at jip_nvse BaseExtraList::GetByType). Cost: worn weapons' damage-stage models may not
; refresh when they load. The key is set in both sections because the DLL lists both and the
; section it reads this one from could not be confirmed.
[Fixes]
bWeaponDamageStagesFix = 0

[Tweaks]
bWeaponDamageStagesFix = 0
